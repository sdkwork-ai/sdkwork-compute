[workspace]
resolver = "2"
members = [
    "crates/sdkwork-compute-service",
    "crates/sdkwork-compute-repository-memory",
    "crates/sdkwork-compute-service-host",
    "crates/sdkwork-compute-repository-sqlx",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
async-trait = "0.1"

sdkwork-compute-service = { path = "crates/sdkwork-compute-service" }
sdkwork-compute-repository-memory = { path = "crates/sdkwork-compute-repository-memory" }
sdkwork-compute-service-host = { path = "crates/sdkwork-compute-service-host" }
sdkwork-compute-repository-sqlx = { path = "crates/sdkwork-compute-repository-sqlx" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
