[package]
name = "sdkwork-compute-repository-sqlx"
version = "0.1.0"
edition = "2021"
description = "PostgreSQL sqlx repository for the compute lease domain"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sdkwork-compute-service = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
